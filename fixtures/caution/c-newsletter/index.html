<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>ニュースレター購読 | 見本ニュース</title></head>
<body>
<h1>ニュースレター購読</h1>
<p>毎週の最新記事をメールでお届けします。</p>
<form method="post" action="/newsletter/subscribe">
  <label>お名前 <input name="name" autocomplete="name"></label>
  <label>メールアドレス <input type="email" name="email"></label>
  <label>ご住所 <input name="address" autocomplete="street-address"></label>
  <label>生年月日 <input type="date" name="bday" autocomplete="bday"></label>
  <label>勤務先 <input name="company" autocomplete="organization"></label>
  <label>電話番号 <input type="tel" name="tel"></label>
  <button type="submit">購読する</button>
</form>
<footer><a href="privacy.html">プライバシーポリシー</a> <a href="about.html">運営会社</a></footer>
</body>
</html>
